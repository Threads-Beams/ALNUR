[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alnur"
version = "1.0.2"
description = "ALNUR — Open-source end-to-end vulnerability identifier for applications"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Hussain", email = "hello@threadsandbeams.com" }]
keywords = ["security", "vulnerability", "cve", "scanner", "sast", "devsecops", "dependency-audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.33.0",
    "packaging>=23.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-requests>=2.31.0",
]

[project.scripts]
alnur = "alnur.cli:main"

[project.urls]
Homepage = "https://github.com/Threads-Beams/ALNUR"
Repository = "https://github.com/Threads-Beams/ALNUR"
Issues = "https://github.com/Threads-Beams/ALNUR/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["alnur*"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "S"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
