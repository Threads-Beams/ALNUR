name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests yet"

      - name: Check imports
        run: |
          python -c "from alnur.core.models import ScanResult; print('Models OK')"
          python -c "from alnur.core import scanner; print('Scanner OK')"
          python -c "from alnur.detectors import project_type, dependency; print('Detectors OK')"
          python -c "from alnur.analyzers import cve, secrets, architecture, standards, ports; print('Analyzers OK')"
          python -c "from alnur.reporters import console, json_reporter, html_reporter; print('Reporters OK')"

      - name: Lint with ruff
        run: ruff check alnur/ --select E,F,W || true
